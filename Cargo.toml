[package]
name = "uptime-api"
version = "0.1.0"
edition = "2024"

description = ""
license = "MIT"
repository = "https://github.com/kadynjaipearce/uptime-api"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
color-eyre = "0.6.5"
dotenvy = "0.15.7"
rand = "0.10.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "migrate", "json"] }
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["full"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.2", features = ["v4", "serde"] }

[lints.clippy]
# Deny anything that can panic on data we don't control at compile time —
# this is a long-running service, a panic in a request/check path takes
# down the process rather than returning an error.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
